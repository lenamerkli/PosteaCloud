<div class="admin-drives">
  <div class="admin-drives__header">
    <button mat-flat-button color="primary" type="button" (click)="createDrive()" aria-label="New drive">
      <mat-icon>add</mat-icon>
      New drive
    </button>
  </div>

  @if (loading()) {
    <p>Loading…</p>
  } @else {
    <table mat-table [dataSource]="drives()" class="admin-drives__table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef scope="col">Name</th>
        <td mat-cell *matCellDef="let drive">{{ drive.name }}</td>
      </ng-container>
      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef scope="col">Location</th>
        <td mat-cell *matCellDef="let drive">{{ drive.location }}</td>
      </ng-container>
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef scope="col">Description</th>
        <td mat-cell *matCellDef="let drive">{{ drive.description }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef scope="col">
          <span class="cdk-visually-hidden">Actions</span>
        </th>
        <td mat-cell *matCellDef="let drive">
          <button mat-icon-button type="button" (click)="renameDrive(drive)" [attr.aria-label]="'Rename ' + drive.name">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="deleteDrive(drive)" [attr.aria-label]="'Delete ' + drive.name">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }
</div>
